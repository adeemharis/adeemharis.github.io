<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting — Adeem Haris</title>
    <link rel="canonical" href="https://adeemharis.github.io/blogs.html">
    <meta http-equiv="refresh" content="0; url=blogs.html">
    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (id) {
            window.location.replace(`articles/${encodeURIComponent(id)}.html`);
        } else {
            window.location.replace('blogs.html');
        }
    </script>
</head>
<body style="font-family: sans-serif; padding: 40px; text-align: center; color: #4a4d54;">
    <p>Redirecting to <a href="blogs.html">Writing &amp; Research Notes</a>...</p>
</body>
</html>
